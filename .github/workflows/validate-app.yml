name: Validate app

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release_tag:
        description: App version tag to validate, including completed release notes
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  metadata:
    name: Validate metadata and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Validate app and dictionary metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python Tools/app_release.py check "$RELEASE_TAG" --require-notes
          else
            python Tools/app_release.py check
          fi

      - name: Test release and dictionary tooling
        run: python -m unittest discover -s Tools/tests -v

  test-and-build:
    name: Run unit tests and verify Release IPA
    needs: metadata
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode 26+
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          def xcode_version(app: Path) -> tuple[int, ...]:
              tool = app / "Contents/Developer/usr/bin/xcodebuild"
              if not tool.is_file():
                  return (0,)
              out = subprocess.check_output([str(tool), "-version"], text=True)
              match = re.search(r"Xcode (\d+(?:\.\d+)*)", out)
              return tuple(int(part) for part in match.group(1).split(".")) if match else (0,)

          developer_dir = Path(subprocess.check_output(["xcode-select", "-p"], text=True).strip())
          current = developer_dir.parents[1]
          candidates = sorted(Path("/Applications").glob("Xcode_26*.app"))
          if current.exists() and current not in candidates:
              candidates.append(current)
          best = max(candidates, key=xcode_version) if candidates else current
          version = xcode_version(best)
          if version < (26, 0):
              sys.exit(f"Requires Xcode 26+, found {version}")
          if best != current:
              subprocess.run(["sudo", "xcode-select", "-s", str(best / "Contents/Developer")], check=True)
          subprocess.run(["xcodebuild", "-version"], check=True)
          PY

      - name: Resolve iOS Simulator destination
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True))
          choices = []
          for runtime, devices in data.get("devices", {}).items():
              match = re.search(r"iOS-(\d+)(?:-(\d+))?(?:-(\d+))?", runtime)
              if not match:
                  continue
              os_ver = tuple(int(part or 0) for part in match.groups())
              if os_ver[0] < 26:
                  continue
              for device in devices:
                  name = device.get("name", "")
                  if device.get("isAvailable") and name.startswith("iPhone"):
                      preferred = 1 if name == "iPhone 17 Pro" else 0
                      choices.append((preferred, os_ver, name, device["udid"]))
          if not choices:
              sys.exit("No available iOS 26+ iPhone simulator found")
          _, os_ver, name, udid = max(choices)
          print(f"Selected simulator: {name} (iOS {'.'.join(map(str, os_ver))}, {udid})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"udid={udid}\n")
          PY

      - name: Run ReadlingTests
        run: |
          xcodebuild -project Readling.xcodeproj -scheme Readling \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            test -only-testing:ReadlingTests

      - name: Build and verify unsigned Release IPA
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 Tools/app_release.py build
          else
            python3 Tools/app_release.py build --allow-unreleased
          fi
